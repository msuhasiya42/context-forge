# Context window per model call (spec 8.2 and 8.6).
capInputTokens: 40000
responseAllowanceTokens: 4000
marginFraction: 0.10
keepLastMessages: 6
factsCap: 30

# Tool result shaping (spec 8.3): rows, columns and characters kept in context.
toolResultRowCap: 50
columnCap: 20
cellCharCap: 200

# Run limits. callBudget counts the model calls that reached a model; attempts the provider
# refused before generating (429, 503, access denied, unreachable) count only toward
# refusedCallBudget, so a provider that refuses forever still ends the request.
callBudget: 50
refusedCallBudget: 30
# Search and fetch combined across the request, including failed attempts and resumes.
webToolCallBudget: 50
tasksInFlight: 5
toolCallsPerTask: 6
taskRetries: 1
noProgressTurns: 3

# Lead researcher (F16). Rounds of research per request: round 1 is the plan's researchers;
# after each round but the last the lead reviews the findings and may start more. 1 turns
# the loop off (one plan, one execute, cite, report).
researchRounds: 3
# The most researchers the lead starts in one round; the plan prompt states it as the
# ceiling for a complex or broad question.
tasksPerRound: 5
# The most researchers in one request across all rounds.
tasksPerRequest: 12
