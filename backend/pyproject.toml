[project]
name = "contextforge"
version = "0.1.0"
description = "Research-agent engine for private financial documents."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "duckdb>=1.1",
    "pyyaml>=6",
    "python-ulid>=3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.35",
    "pydantic-settings>=2.6",
    "httpx>=0.28.1",
    "langsmith>=0.14.17",
]

[project.scripts]
contextforge-api = "contextforge.api.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextforge"]

[tool.ruff]
line-length = 100
# Python only. Markdown holds docs and verbatim prompts whose code blocks ruff would
# reformat.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Defaults: double quotes, space indent; line length comes from [tool.ruff].

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
