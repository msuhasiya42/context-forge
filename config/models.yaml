priceVersion: "2026-11-07"
# USD per million tokens, Bedrock on-demand. A geo inference profile (apac.<model>) bills at the
# source region's price for <model>. Nova rows: Sydney on-demand, recorded 7 Nov 2026.
# Claude rows: Anthropic list prices, not verified for Bedrock Sydney; unused until the account
# has Anthropic model access.
prices:
  "amazon.nova-pro-v1:0":     { inputPerMTok: 0.80, outputPerMTok: 3.20,  cacheReadPerMTok: 0.0 }
  "amazon.nova-lite-v1:0":    { inputPerMTok: 0.06, outputPerMTok: 0.24,  cacheReadPerMTok: 0.0 }
  anthropic.claude-opus-5-5:  { inputPerMTok: 4.00, outputPerMTok: 20.00, cacheReadPerMTok: 0.20 }
  anthropic.claude-haiku-5-5: { inputPerMTok: 0.10, outputPerMTok: 0.50,  cacheReadPerMTok: 0.01 }
  scripted:                   { inputPerMTok: 0.0,  outputPerMTok: 0.0,   cacheReadPerMTok: 0.0 }
# The model per stage on the Bedrock backend. CONTEXTFORGE_PLANNER_MODEL (plan, cite) and
# CONTEXTFORGE_EXECUTOR_MODEL (execute, compress) may override it; prices always come from above.
stages:
  plan:     { model: "apac.amazon.nova-pro-v1:0",  effort: high,   maxTokens: 4000 }  # later: au.anthropic.claude-opus-5-5
  execute:  { model: "apac.amazon.nova-lite-v1:0", effort: medium, maxTokens: 4000 }  # later: au.anthropic.claude-haiku-5-5
  cite:     { model: "apac.amazon.nova-pro-v1:0",  effort: high,   maxTokens: 4000 }
  compress: { model: "apac.amazon.nova-lite-v1:0", effort: low,    maxTokens: 1000 }
